<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="theme-color" content="#2563eb">

    <title>خدمات صنعتی</title>

    <!-- Eitaa JavaScript SDK -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚙️</span>
                <h1>خدمات صنعتی</h1>
            </div>

            <p class="subtitle">
                دستیار هوشمند خدمات صنعتی
            </p>
        </header>


        <!-- Main Content -->
        <main class="main">

            <div class="welcome">
                <h2>خوش آمدید</h2>

                <p>
                    لطفاً نوع خدمت موردنظر خود را انتخاب کنید.
                </p>
            </div>


            <!-- Buttons -->
            <div class="services">

                <button
                    class="service-button provider"
                    id="providerBtn"
                    type="button">

                    <span class="button-icon">🏭</span>

                    <span class="button-content">
                        <strong>خدمات دهنده</strong>
                        <small>
                           ثبت آگهی خدماتی
                        </small>
                    </span>

                    <span class="arrow">←</span>

                </button>


                <button
                    class="service-button receiver"
                    id="receiverBtn"
                    type="button">

                    <span class="button-icon">🔍</span>

                    <span class="button-content">
                        <strong>خدمات گیرنده</strong>
                        <small>
                            جستجو واحدهای خدماتی
                        </small>
                    </span>

                    <span class="arrow">←</span>

                </button>


                <button
                    class="service-button support"
                    id="supportBtn"
                    type="button">

                    <span class="button-icon">💬</span>

                    <span class="button-content">
                        <strong>خرید و فروش دستگاه</strong>
                        <small>
                           ثبت آگهی خرید و فروش دستگاه
                        </small>
                    </span>

                    <span class="arrow">←</span>

                </button>

            </div>

        </main>


        <!-- Footer -->
        <footer class="footer">
            <p>خدمات صنعتی</p>
        </footer>

    </div>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
